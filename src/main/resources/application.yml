server:
  port: 8081

spring:
  application:
    name: 000_Work_Demo
  task:
    execution:
      pool:
        core-size: 10       # 核心10线程
        max-size: 20        # 最大20线程
        queue-capacity: 500 # 队列缓冲
    scheduling:
      pool:
        size: 4
      thread-name-prefix: schedule-
      shutdown:
        await-termination: true
        await-termination-period: 60s
  # 开发默认本地库；线上见 application-remote.yml（--spring.profiles.active=remote）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/game3?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&socketTimeout=60000&connectTimeout=3000
    username: root
    password: 123456

  data:
    redis:
      host: 127.0.0.1
      database: 0
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: #org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

app:
  cors:
    # 生产环境通过 APP_CORS_ALLOWED_ORIGIN_PATTERNS 配置明确域名，逗号分隔。
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
    # 本地直接双击 file:// 页面时 Origin 为 null；生产环境应设置为 false。
    allow-null-origin: ${APP_CORS_ALLOW_NULL_ORIGIN:true}
  upload:
    root-windows: ${APP_UPLOAD_ROOT_WINDOWS:D:/File/Work/Java/002_DP/}
    root-linux: ${APP_UPLOAD_ROOT_LINUX:/www/wx/file/}

