spring:
  devtools:
    livereload:
      enabled: true
      port: 35729
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
  web:
    resources:
      # 直接读源码目录，改 html/js/css 即时生效
      static-locations:
        - file:src/main/resources/static/
        - classpath:/static/
      cache:
        period: 0
      chain:
        cache: false
