<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>修改密码</title>
  <link rel="icon" type="image/png" href="art/ui/game-app-icon.png">
  <link rel="apple-touch-icon" href="art/ui/game-app-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/player-polish.css?v=20260809a">
  <script src="js/dev-live.js"></script>
  <script src="js/vue.global.prod.js"></script>
  <script src="js/config.js"></script>
  <script src="js/art.js"></script>
</head>
<body>
<div id="app" class="page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="brand">
    <div class="brand-badge art-slot" data-art="brand/logo.svg">
      <img class="brand-logo" alt="" hidden>
      <span class="brand-fallback">G</span>
    </div>
    <h1>修改密码</h1>
    <p>可用原密码，或用邮箱验证码设置</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab" :class="{ active: mode === 'old' }" @click="mode = 'old'; clearErrors()">原密码修改</button>
      <button class="tab" :class="{ active: mode === 'code' }" @click="mode = 'code'; clearErrors()">验证码设置</button>
    </div>

    <div class="field" v-if="mode === 'old'">
      <label>原密码</label>
      <div class="input-wrap" :class="{ error: !!errors.oldPassword }">
        <input v-model="form.oldPassword" type="password" placeholder="请输入原密码" autocomplete="current-password" @input="errors.oldPassword = ''">
      </div>
      <div v-if="errors.oldPassword" class="field-error">{{ errors.oldPassword }}</div>
    </div>

    <div class="field" v-else>
      <label>邮箱验证码</label>
      <div class="input-wrap" :class="{ error: !!errors.emsCode }">
        <input v-model.trim="form.emsCode" type="text" maxlength="6" placeholder="请输入验证码" inputmode="numeric" @input="errors.emsCode = ''">
        <button class="code-btn" :disabled="countdown > 0 || sendingCode || !email" @click="sendCode">
          {{ countdown > 0 ? countdown + 's' : (sendingCode ? '发送中…' : '获取验证码') }}
        </button>
      </div>
      <div v-if="errors.emsCode" class="field-error">{{ errors.emsCode }}</div>
      <div class="tip" style="margin-top:8px" v-if="email">将发送至 {{ email }}</div>
    </div>

    <div class="field">
      <label>新密码</label>
      <div class="input-wrap" :class="{ error: !!errors.newPassword }">
        <input v-model="form.newPassword" type="password" placeholder="至少 6 位" autocomplete="new-password" @input="errors.newPassword = ''">
      </div>
      <div v-if="errors.newPassword" class="field-error">{{ errors.newPassword }}</div>
    </div>

    <div class="field">
      <label>确认新密码</label>
      <div class="input-wrap" :class="{ error: !!errors.newPasswordAgain }">
        <input v-model="form.newPasswordAgain" type="password" placeholder="请再次输入新密码" autocomplete="new-password" @input="errors.newPasswordAgain = ''">
      </div>
      <div v-if="errors.newPasswordAgain" class="field-error">{{ errors.newPasswordAgain }}</div>
    </div>

    <button class="btn-primary btn-block" :disabled="loading" @click="submit">
      {{ loading ? '提交中...' : '确认修改' }}
    </button>

    <div class="links">
      <a href="index.html">返回首页</a>
      <span></span>
    </div>

    <div class="tip">验证码登录自动注册的账号，请用「验证码设置」完成首次设密。调试期间验证码固定为 <strong>123456</strong></div>
  </div>

  <div v-if="toast.show" class="toast" :class="toast.type">{{ toast.text }}</div>
</div>

<script src="js/api.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      mode: 'old',
      loading: false,
      sendingCode: false,
      countdown: 0,
      timer: null,
      email: '',
      form: { oldPassword: '', emsCode: '', newPassword: '', newPasswordAgain: '' },
      errors: { oldPassword: '', emsCode: '', newPassword: '', newPasswordAgain: '' },
      toast: { show: false, text: '', type: 'error' }
    };
  },
  mounted() {
    if (!GameApi.getToken()) {
      location.href = (APP_CONFIG.loginPage || 'login.html');
      return;
    }
    GameApi.userInfo()
      .then((res) => {
        this.email = (res.data && res.data.email) || '';
      })
      .catch(() => {
        GameApi.clearToken();
        location.href = (APP_CONFIG.loginPage || 'login.html');
      });
    this.$nextTick(() => {
      if (!window.ArtSlots) return;
      var root = document.getElementById('app');
      ArtSlots.apply(root);
      var badge = root && root.querySelector('.brand-badge');
      if (!badge) return;
      ArtSlots.probe('brand/logo.svg').then(function (url) {
        var img = badge.querySelector('.brand-logo');
        var fb = badge.querySelector('.brand-fallback');
        if (url && img) {
          img.src = url;
          img.hidden = false;
          if (fb) fb.hidden = true;
          badge.classList.add('art-ready');
        }
      });
    });
  },
  beforeUnmount() {
    if (this.timer) clearInterval(this.timer);
  },
  methods: {
    clearErrors() {
      this.errors = { oldPassword: '', emsCode: '', newPassword: '', newPasswordAgain: '' };
    },
    showToast(text, type) {
      this.toast = { show: true, text: text, type: type || 'error' };
      setTimeout(() => { this.toast.show = false; }, 2200);
    },
    startCountdown() {
      this.countdown = 60;
      this.timer = setInterval(() => {
        this.countdown -= 1;
        if (this.countdown <= 0) { clearInterval(this.timer); this.timer = null; }
      }, 1000);
    },
    sendCode() {
      if (!this.email || this.countdown > 0) return;
      this.sendingCode = true;
      GameApi.sendEmailCode(this.email)
        .then(() => { this.showToast('验证码已发送', 'success'); this.startCountdown(); })
        .catch((err) => this.showToast(err.message))
        .finally(() => { this.sendingCode = false; });
    },
    validateNewPassword() {
      if (!this.form.newPassword) { this.errors.newPassword = '请输入新密码'; return false; }
      if (this.form.newPassword.length < 6) { this.errors.newPassword = '新密码至少 6 位'; return false; }
      if (this.form.newPassword !== this.form.newPasswordAgain) {
        this.errors.newPasswordAgain = '两次新密码不一致';
        return false;
      }
      return true;
    },
    submit() {
      this.clearErrors();
      if (!this.validateNewPassword()) return;
      this.loading = true;
      var done = () => {
        this.showToast('密码已修改', 'success');
        setTimeout(() => { location.href = (APP_CONFIG.homePage || 'index.html'); }, 600);
      };
      var fail = (err) => this.showToast(err.message || '修改失败');
      var fin = () => { this.loading = false; };

      if (this.mode === 'old') {
        if (!this.form.oldPassword) { this.errors.oldPassword = '请输入原密码'; this.loading = false; return; }
        if (this.form.newPassword === this.form.oldPassword) {
          this.errors.newPassword = '新密码不能与原密码相同';
          this.loading = false;
          return;
        }
        GameApi.changePassword(this.form.oldPassword, this.form.newPassword, this.form.newPasswordAgain)
          .then(done).catch(fail).finally(fin);
        return;
      }
      if (!this.form.emsCode) { this.errors.emsCode = '请输入验证码'; this.loading = false; return; }
      GameApi.setPasswordByCode(this.form.emsCode, this.form.newPassword, this.form.newPasswordAgain)
        .then(done).catch(fail).finally(fin);
    }
  }
}).mount('#app');
</script>
</body>
</html>
