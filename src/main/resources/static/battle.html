<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>战斗</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/battle.css">
  <script src="/js/dev-live.js"></script>
  <script src="/js/vue.global.prod.js"></script>
  <script src="/js/art.js"></script>
</head>
<body>
<div id="app" class="page battle-page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <header class="battle-header">
    <button type="button" class="bh-back hit-44" aria-label="返回" @click="goBack">‹</button>
    <div class="bh-title">
      <strong>战斗</strong>
      <span v-if="levelTitle" class="ellipsis">{{ levelTitle }}</span>
    </div>
    <div class="bh-axis" v-if="battleStarted" aria-live="polite" :title="'轴 ' + axisDisplay">
      <span class="bh-axis-num num">{{ axisTimeText }}</span>
    </div>
    <div class="bh-actions">
      <button
        type="button"
        class="bh-skip hit-44"
        :disabled="!showSpeedCtrl"
        @click="skipReplay"
      >跳过</button>
      <button
        type="button"
        class="bh-speed hit-44"
        :disabled="!showSpeedCtrl"
        @click="cycleSpeed"
      >»{{ playbackSpeed }}x</button>
      <button type="button" class="bh-home hit-44" @click="goHome">首页</button>
    </div>
  </header>

  <div v-if="loading" class="loading-wrap">
    <div class="skeleton-block" style="height:120px;margin-bottom:10px"></div>
    <div class="skeleton-block" style="height:120px"></div>
  </div>

  <div v-else-if="error" class="error-wrap">
    <div>{{ error }}</div>
    <button type="button" class="btn-battle-ghost" @click="goBack">返回出击</button>
  </div>

  <template v-else>
    <div class="battle-main">
      <div
        class="arena"
        ref="arena"
        :class="[
          { fighting: fighting || replaying, win: outcome === 'WIN', lose: outcome === 'LOSE' },
          shakeClass
        ]"
      >
        <div class="fx-layer" aria-hidden="true">
          <div
            v-for="f in floaters"
            :key="f.id"
            class="floater"
            :class="[f.cls, f.dir === 'down' ? 'dir-down' : 'dir-up']"
            :style="{ '--x': f.x + 'px', '--y': f.y + 'px', '--push': (f.push || 0) + 'px' }"
          >{{ f.text }}</div>
        </div>

        <div class="side-block enemy-side">
          <div class="formation-board enemy">
            <div class="formation-grid">
              <div class="formation-cells" aria-hidden="true">
                <div v-for="n in 30" :key="'ec-' + n" class="formation-cell"></div>
              </div>
              <div class="formation-units">
                <div
                  v-for="(m, idx) in monsters"
                  :key="unitKey(m, 'm', idx)"
                  class="formation-unit"
                  :data-uid="unitUid(m)"
                  :class="unitBoardClass(m, 'enemy')"
                  :style="unitGridStyle(m)"
                  @click="focusUnit(unitUid(m))"
                >
                  <i class="unit-shadow art-slot" data-art="ui/unit-shadow.png"></i>
                  <i class="unit-aura art-slot" :data-art="'ui/aura-' + auraKey(m.rarity) + '.png'"></i>
                  <div
                    class="unit-sprite"
                    :class="{ 'has-spr': hasSprite(m) }"
                  ></div>
                  <div class="unit-hp" aria-hidden="true">
                    <i :style="{ width: unitHpPct(unitUid(m)) + '%' }"></i>
                  </div>
                  <div class="unit-skill-rings" v-if="monsterSkillRings(unitUid(m)).length" aria-hidden="true">
                    <div
                      v-for="r in monsterSkillRings(unitUid(m))"
                      :key="r.key"
                      class="usk-ring"
                      :class="[r.cls, { full: r.pct >= 100 }]"
                    >
                      <svg class="usk-svg" viewBox="0 0 32 32">
                        <circle class="usk-track" cx="16" cy="16" r="12"></circle>
                        <circle
                          class="usk-prog"
                          cx="16"
                          cy="16"
                          r="12"
                          :stroke-dasharray="r.circ"
                          :stroke-dashoffset="r.offset"
                        ></circle>
                      </svg>
                      <span class="usk-label">{{ r.label }}</span>
                    </div>
                  </div>
                  <span class="unit-tag name-enemy" :class="{ 'with-rings': monsterSkillRings(unitUid(m)).length }">{{ shortName(m.monsterName || m.name) }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="clash-line" :class="{ sweep: clashSweep }" aria-hidden="true">
          <i class="clash-beam art-slot" data-art="ui/clash-line.png"></i>
          <span>⚔</span>
        </div>

        <div class="side-block ally-side">
          <div class="formation-board ally">
            <div class="formation-grid">
              <div class="formation-cells" aria-hidden="true">
                <div v-for="n in 30" :key="'ac-' + n" class="formation-cell"></div>
              </div>
              <div class="formation-units">
                <div
                  v-for="(u, idx) in allies"
                  :key="unitKey(u, 'a', idx)"
                  class="formation-unit player"
                  :data-uid="unitUid(u)"
                  :class="unitBoardClass(u, 'ally')"
                  :style="unitGridStyle(u)"
                  @click="focusUnit(unitUid(u))"
                >
                  <i class="unit-shadow art-slot" data-art="ui/unit-shadow.png"></i>
                  <i class="unit-aura art-slot" data-art="ui/aura-rare.png"></i>
                  <div
                    class="unit-sprite"
                    :class="{ 'has-spr': hasSprite(u) }"
                  ></div>
                  <div class="unit-hp ally" aria-hidden="true">
                    <i :style="{ width: unitHpPct(unitUid(u)) + '%' }"></i>
                  </div>
                  <span class="unit-tag name-ally">{{ allyUiName(u) }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="focus-bar" v-if="focusUnitView">
      <div class="fb-face">{{ focusUnitView.ch }}</div>
      <div class="fb-mid">
        <div class="fb-name">
          <span>{{ focusUnitView.name }}</span>
          <span class="fb-hpnum num">{{ focusUnitView.hp }}/{{ focusUnitView.maxHp }}</span>
        </div>
        <div class="hpbar">
          <i class="hp-ghost" :style="{ width: focusUnitView.ghostPct + '%' }"></i>
          <i class="hp-fill" :style="{ width: focusUnitView.hpPct + '%' }"></i>
        </div>
        <div class="fb-charges hide-scrollbar" v-if="focusUnitView.charges.length">
          <div
            v-for="c in focusUnitView.charges"
            :key="c.skillId"
            class="fb-charge"
            :class="['mode-' + c.mode, { full: c.full }]"
          >
            <span class="cg-name">{{ c.name || '充能' }}</span>
            <span v-if="c.mode === 'gem'" class="cg-gems" :title="c.cur + '/' + c.max">
              <i
                v-for="k in c.max"
                :key="'gem-' + c.skillId + '-' + k"
                class="cg-gem"
                :class="{ on: k <= c.cur }"
              ></i>
            </span>
            <span v-else-if="c.mode === 'battery'" class="batt" :title="c.cur + '/' + c.max">
              <i
                v-for="k in c.max"
                :key="'bat-' + c.skillId + '-' + k"
                :class="{ on: k <= c.cur }"
              ></i>
            </span>
            <span v-else class="cg-bar" :title="c.cur + '/' + c.max">
              <i :style="{ width: c.pct + '%' }"></i>
            </span>
            <span class="cg-num num">{{ c.cur }}/{{ c.max }}</span>
          </div>
        </div>
      </div>
      <div class="fb-buffs">
        <span v-for="(b, bi) in focusUnitView.buffs" :key="'bf-' + bi" class="buff" :class="b.dir === 'DOWN' ? 'down' : 'up'">
          {{ b.dir === 'DOWN' ? '⬇' : '⬆' }}{{ b.attrKey }}<em v-if="b.stack > 1">×{{ b.stack }}</em><em v-if="b.duration > 0">·{{ b.duration }}</em>
        </span>
      </div>
    </div>

    <div
      class="log-drawer"
      :class="{ open: logDrawerOpen, has: visibleLogs.length }"
      @pointerdown="onLogDrawerDown"
      @pointermove="onLogDrawerMove"
      @pointerup="onLogDrawerUp"
      @pointercancel="onLogDrawerUp"
    >
      <div class="log-drawer-handle"></div>
      <div class="battle-log-head">
        <span>战斗日志</span>
        <span class="battle-log-count">
          <template v-if="visibleLogs.length">{{ visibleLogs.length }}{{ pendingLogs.length ? ' / ' + (visibleLogs.length + pendingLogs.length) : '' }}</template>
          <template v-if="visibleLogs.length"> · {{ logDrawerOpen ? '下滑收起' : '上滑展开' }}</template>
        </span>
      </div>
      <div class="battle-log-list" ref="logList">
        <div v-if="!visibleLogs.length" class="battle-log-empty">战斗进行中，日志将在此播放</div>
        <template v-for="(block, bIdx) in visibleLogBlocks" :key="'logb-' + bIdx">
          <div v-if="block.kind === 'special'" class="battle-log-line" :class="block.cls" v-html="block.html"></div>
          <div v-else class="battle-log-group" :class="block.groupCls">
            <div
              v-for="(row, rIdx) in block.rows"
              :key="'logr-' + bIdx + '-' + rIdx"
              class="battle-log-line"
              :class="row.cls"
              v-html="row.html"
            ></div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <div v-if="resultBanner" class="result-banner" :class="resultBanner">
    {{ resultBanner === 'win' ? '胜利' : '失败' }}
  </div>

  <div v-if="resultModal.show" class="result-mask" @click.self="closeResultModal">
    <div class="result-modal" :class="resultModal.outcome === 'WIN' ? 'is-win' : 'is-lose'">
      <h2 class="result-level-title" v-if="levelTitle">{{ levelTitle }}</h2>
      <div class="result-stat-row">
        <div class="result-outcome">{{ resultModal.outcome === 'WIN' ? '战斗胜利' : '战斗失败' }}</div>
        <div class="result-time" v-if="resultModal.durationText">用时 {{ resultModal.durationText }}</div>
      </div>

      <template v-if="resultModal.outcome === 'WIN'">
        <template v-if="resultModal.drops.length">
          <div class="result-section-label">获得材料</div>
          <div class="result-loot">
            <div
              v-for="(d, i) in resultModal.drops"
              :key="d.itemId || ('drop-' + i)"
              class="result-loot-row"
              :style="{ '--stagger': i }"
            >
              <div class="result-loot-icon">
                <img v-if="itemIconIsImage(d.icon)" :src="d.icon" :alt="d.itemName">
                <span v-else>{{ d.icon || '📦' }}</span>
              </div>
              <div class="result-loot-name">{{ d.itemName || '未知材料' }}</div>
              <div class="result-loot-qty">×{{ d.quantity || 0 }}</div>
            </div>
          </div>
          <div class="result-loot-note">已放入仓库</div>
        </template>
        <div v-else class="result-loot-empty">本场无掉落</div>
      </template>
      <div v-else class="result-lose-tip">再调整阵容或升级后再战</div>

      <div class="result-actions">
        <button
          v-if="resultModal.outcome === 'WIN'"
          type="button"
          class="result-btn primary"
          :disabled="!nextLevelId"
          @click="goNextLevel"
        >{{ nextLevelId ? '下一关' : '已是最后一关' }}</button>
        <button type="button" class="result-btn gold" @click="fightAgain">再战一次</button>
        <div class="result-actions-row">
          <button type="button" class="result-btn ghost" @click="goHome">回去首页</button>
          <button type="button" class="result-btn ghost" @click="viewLogs">查看日志</button>
        </div>
      </div>
    </div>
  </div>

  <div v-if="toast.show" class="toast" :class="toast.type">{{ toast.text }}</div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
const { createApp } = Vue;

/** 总轴映射：100 行动值 = 2000ms 墙钟（1x）；倍速再除以 playbackSpeed */
const AV_MS = 2000 / 100;
/** 时间显示：100 轴 = 2 秒 */
const AV_PER_SEC = 100 / 2;
/**
 * 【暂关】等动画播完再走轴：同 tick 节拍等待。
 * 当前轴为独立时钟，永不因动画停顿；需要时可改 true 并恢复 scheduleNextEventAt 路径。
 */
const USE_EVENT_ANIM_WAIT = false;
/** 同一行动值上连续事件（CAST→HIT→HEAL）的可读节拍（仅 USE_EVENT_ANIM_WAIT 时） */
const SAME_TICK_MS = 72;
/** 仅用于高亮等表现，不再驱动回放主时钟 */
const EVENT_DUR = {
  CAST: 380,
  DEATH: 480,
  _gap: 120
};

function queryParam(name) {
  return new URLSearchParams(location.search).get(name) || '';
}

createApp({
  data() {
    return {
      loading: true,
      error: '',
      levelId: '',
      levelTitle: '',
      stageTree: [],
      monsters: [],
      allies: [],
      battleStarted: false,
      fighting: false,
      replaying: false,
      outcome: '',
      visibleLogs: [],
      pendingLogs: [],
      actingUid: '',
      hitUid: '',
      deadUids: {},
      hpMap: {},
      ghostHp: {},
      chargeMap: {},
      /** uid -> { NORMAL|SMALL|ULTIMATE: { skillId, need, avEvery, avGain, baseCur, baseAv } } */
      unitSkillSlots: {},
      /** uid -> skillId -> slot（全量技能，焦点充能用） */
      unitSkillById: {},
      buffMap: {},
      focusUid: '',
      floaters: [],
      floaterSeq: 0,
      shakeClass: '',
      clashSweep: false,
      resultBanner: '',
      logDrawerOpen: false,
      logDrag: null,
      replayTimer: null,
      rafId: 0,
      rafNextAt: 0,
      replayMode: '',
      replayData: null,
      replayLogs: [],
      replayEvents: [],
      replayIndex: 0,
      eventIndex: 0,
      logCursor: 0,
      replayAvT: 0,
      logAvT: 0,
      axisDisplay: 0,
      /** 自由轴：墙钟原点 + 对应轴值，轴只跟时间走 */
      axisWallOrigin: 0,
      axisAvOrigin: 0,
      axisFinalAv: 0,
      axisLerp: null,
      skipRequested: false,
      playbackSpeed: 1,
      resultModal: { show: false, outcome: '', ticks: null, durationText: '', drops: [] },
      toast: { show: false, text: '', type: 'error' },
      reducedMotion: false
    };
  },
  computed: {
    showSpeedCtrl() {
      return this.battleStarted && (this.fighting || this.replaying) && !this.resultModal.show;
    },
    /** 100轴=2秒 → 换算成「X.XX秒」或「M分 S.SS秒」 */
    axisTimeText() {
      return this.formatAvAsTime(this.axisDisplay);
    },
    nextLevelId() {
      var list = this.flattenLevels(this.stageTree);
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === this.levelId) return list[i + 1] ? list[i + 1].id : '';
      }
      return '';
    },
    allyNameSet() {
      var set = {};
      (this.allies || []).forEach((a) => {
        var n = a && (a.roleName || a.name);
        if (n) set[n] = true;
      });
      Object.keys(this.hpMap || {}).forEach((k) => {
        var s = this.hpMap[k];
        if (s && s.side === 'ALLY' && s.name) set[s.name] = true;
      });
      return set;
    },
    enemyNameSet() {
      var set = {};
      (this.monsters || []).forEach((m) => {
        var n = m && (m.monsterName || m.name);
        if (n) set[n] = true;
      });
      Object.keys(this.hpMap || {}).forEach((k) => {
        var s = this.hpMap[k];
        if (s && s.side === 'ENEMY' && s.name) set[s.name] = true;
      });
      return set;
    },
    /** 底部状态条固定主角，不随行动/点击切换到怪 */
    heroUid() {
      var allies = this.allies || [];
      for (var i = 0; i < allies.length; i++) {
        var u = allies[i];
        if (!u) continue;
        if (u.mainRole || u.code === 'hero' || u.name === '主角' || u.roleName === '主角') {
          return this.unitUid(u);
        }
      }
      var first = allies[0];
      return first ? this.unitUid(first) : '';
    },
    focusUnitView() {
      var uid = this.heroUid;
      if (!uid) return null;
      var hp = this.hpMap[uid];
      if (!hp) return null;
      var ghost = this.ghostHp[uid];
      var ghostPct = ghost != null && hp.maxHp
        ? Math.max(0, Math.min(100, (ghost / hp.maxHp) * 100))
        : (hp.maxHp ? (hp.hp / hp.maxHp) * 100 : 100);
      var unit = this.findUnitByUid(uid);
      var name = this.allyUiName(unit) || this.allyUiName({ name: hp.name }) || '我';
      return {
        uid: uid,
        name: name,
        ch: String(name).charAt(0),
        faceArt: null,
        hp: hp.hp,
        maxHp: hp.maxHp,
        hpPct: hp.maxHp ? Math.max(0, Math.min(100, (hp.hp / hp.maxHp) * 100)) : 100,
        ghostPct: ghostPct,
        charges: this.focusChargeList(uid),
        buffs: this.buffMap[uid] || []
      };
    },
    visibleLogBlocks() {
      var blocks = [];
      var group = -1;
      var current = null;
      var lines = this.visibleLogs || [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i] || '';
        var treeDepth = this.logTreeDepth(line);
        var child = treeDepth > 0 || /^\s+/.test(line);
        var isBootHead = line === '充能技能' || line === '锚点被动' || line === '周期被动'
          || line.indexOf('装备充能技能') === 0
          || line.indexOf('装备锚点被动') === 0
          || line.indexOf('装备周期被动') === 0;
        var isResultHead = line.indexOf('战斗胜利') >= 0 || line.indexOf('战斗失败') >= 0
          || line.indexOf('总计掉落') >= 0;
        if (isBootHead) {
          group += 1;
          current = { kind: 'group', groupCls: 'log-group-equip', rows: [] };
          blocks.push(current);
          current.rows.push({ cls: [this.logLineClass(line), 'is-head'].join(' '), html: this.escapeHtml(line) });
          continue;
        }
        if (isResultHead) {
          current = { kind: 'group', groupCls: 'log-group-result', rows: [] };
          blocks.push(current);
          current.rows.push({ cls: [this.logLineClass(line), 'is-head'].join(' '), html: this.escapeHtml(line) });
          continue;
        }
        if (!child) {
          group += 1;
          current = { kind: 'group', groupCls: 'log-group-' + (group % 4), rows: [] };
          blocks.push(current);
          current.rows.push({ cls: [this.logLineClass(line), 'is-head'].join(' '), html: this.formatLogHtml(line) });
        } else {
          if (!current) {
            group += 1;
            current = { kind: 'group', groupCls: 'log-group-' + (group % 4), rows: [] };
            blocks.push(current);
          }
          var depthCls = treeDepth >= 2 ? 'is-child is-child-2' : 'is-child is-child-1';
          var html = current.groupCls === 'log-group-equip'
            ? this.formatTreeLogHtml(line)
            : this.formatLogHtml(line);
          current.rows.push({ cls: [this.logLineClass(line), depthCls].join(' '), html: html });
        }
      }
      return blocks;
    }
  },
  mounted() {
    if (!GameApi.getToken()) {
      location.href = APP_CONFIG.loginPage || '/login.html';
      return;
    }
    this.reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var savedSpeed = Number(localStorage.getItem('battlePlaybackSpeed') || 1);
    if (savedSpeed === 1 || savedSpeed === 2 || savedSpeed === 3) this.playbackSpeed = savedSpeed;
    this.levelId = queryParam('levelId')
      || localStorage.getItem(APP_CONFIG.selectedLevelKey || 'selectedLevelId')
      || '';
    if (!this.levelId) {
      this.loading = false;
      this.error = '未选择关卡';
      return;
    }
    this.boot();
  },
  beforeUnmount() {
    this.stopReplayClock();
  },
  watch: {
    focusUid() {
      this.$nextTick(() => { if (window.ArtSlots) ArtSlots.apply(this.$el); });
    },
    replaying() {
      this.$nextTick(() => { if (window.ArtSlots) ArtSlots.apply(this.$el); });
    }
  },
  methods: {
    showToast(text, type) {
      this.toast = { show: true, text: text || '', type: type || 'error' };
      setTimeout(() => { this.toast.show = false; }, 2400);
    },
    authCatch(err) {
      this.showToast(err.message || '加载失败');
      if (err.result && (err.result.code === '403' || String(err.message).indexOf('登录') >= 0)) {
        GameApi.clearToken();
        setTimeout(() => { location.href = APP_CONFIG.loginPage || '/login.html'; }, 800);
      }
    },
    shortName(name) {
      if (!name) return '?';
      return name.length > 5 ? name.slice(0, 5) : name;
    },
    /** 战斗 UI 展示名：主角显示为「我」 */
    allyUiName(u) {
      if (!u) return '我';
      if (u.mainRole || u.code === 'hero') return '我';
      var name = u.roleName || u.name || '';
      if (name === '主角') return '我';
      return this.shortName(name) || '我';
    },
    unitUid(u) {
      if (!u) return '';
      return u.uid || u.unitId || '';
    },
    unitKey(u, prefix, idx) {
      return this.unitUid(u) || (prefix + '-' + idx);
    },
    findUnitByUid(uid) {
      if (!uid) return null;
      var a = (this.allies || []).find((x) => this.unitUid(x) === uid);
      if (a) return a;
      return (this.monsters || []).find((x) => this.unitUid(x) === uid) || null;
    },
    auraKey(r) {
      var k = String(r || 'normal').toLowerCase();
      if (['rare', 'epic', 'boss', 'special', 'normal'].indexOf(k) >= 0) return k;
      return { RARE: 'rare', EPIC: 'epic', BOSS: 'boss', SPECIAL: 'special' }[r] || 'normal';
    },
    /** 战斗单位立绘暂不启用（回退 CSS 占位） */

      if (line.indexOf('治疗') >= 0) return 'is-heal';
      if (line.indexOf('└') >= 0 && line.indexOf(' * ') >= 0) return 'is-loot';
      if (line.indexOf('无掉落') >= 0) return 'is-loot';
      return '';
    },
    logTreeDepth(line) {
      var s = String(line == null ? '' : line);
      if (!s) return 0;
      // 二级：│  └ ...
      if (/│\s*└/.test(s) || /^\s{2,}│/.test(s) || /^\s{6,}└/.test(s)) return 2;
      if (s.indexOf('└') >= 0) return 1;
      if (/^\s+/.test(s)) return 1;
      return 0;
    },
    /** 树形开战日志：保留 │/└ 缩进，空格转成不换行空格 */
    formatTreeLogHtml(line) {
      var raw = String(line == null ? '' : line);
      var html = this.escapeHtml(raw)
        .replace(/ /g, '&nbsp;')
        .replace(/│/g, '<span class="log-tree-rail">│</span>')
        .replace(/└/g, '<span class="log-tree-branch">└</span>');
      return html;
    },
    escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    },
    escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    },
    formatLogHtml(line) {
      var raw = String(line == null ? '' : line);
      var prefix = '';
      var body = raw;
      var avMulti = raw.match(/^行动值\s*(\d+)\n([\s\S]*)$/);
      var avLegacy = raw.match(/^\[行动值\s*(\d+)\]\s*(.*)$/);
      if (avMulti) {
        prefix = '<div class="log-action-val">行动值 ' + this.escapeHtml(avMulti[1]) + '</div>';
        body = avMulti[2] || '';
      } else if (avLegacy) {
        prefix = '<div class="log-action-val">行动值 ' + this.escapeHtml(avLegacy[1]) + '</div>';
        body = avLegacy[2] || '';
      }
      var m = body.match(/^(.*对\s*)(.+?)(\s*造成\s*)(\d+)(\s*伤害.*)$/);
      if (m) {
        var target = m[2];
        var colorCls = 'dmg-num';
        if (this.allyNameSet[target]) colorCls = 'dmg-num-ally';
        else if (this.enemyNameSet[target]) colorCls = 'dmg-num-enemy';
        return prefix + '<div class="log-action-body">'
          + this.wrapNamesInSegment(m[1]) + this.formatLogNameHtml(target)
          + this.escapeHtml(m[3]) + '<span class="' + colorCls + '">' + this.escapeHtml(m[4]) + '</span>'
          + this.wrapNamesInSegment(m[5]) + '</div>';
      }
      if (prefix) return prefix + '<div class="log-action-body">' + this.wrapNamesInSegment(body) + '</div>';
      return this.wrapNamesInSegment(body);
    },
    wrapNamesInSegment(segment) {
      var raw = String(segment == null ? '' : segment);
      var html = this.escapeHtml(raw);
      Object.keys(this.allyNameSet || {}).forEach((name) => {
        if (!name || raw.indexOf(name) < 0) return;
        var re = new RegExp(this.escapeRegExp(this.escapeHtml(name)), 'g');
        html = html.replace(re, '<span class="log-name-ally">[' + this.escapeHtml(name) + ']</span>');
      });
      Object.keys(this.enemyNameSet || {}).sort(function (a, b) { return b.length - a.length; }).forEach((name) => {
        if (!name || raw.indexOf(name) < 0) return;
        var token = this.escapeHtml(name);
        var re = new RegExp(this.escapeRegExp(token), 'g');
        html = html.replace(re, '<span class="log-name-enemy">[' + token + ']</span>');
      });
      return html;
    },
    formatLogNameHtml(name) {
      if (!name) return '';
      if (this.allyNameSet[name]) return '<span class="log-name-ally">[' + this.escapeHtml(name) + ']</span>';
      if (this.enemyNameSet[name]) return '<span class="log-name-enemy">[' + this.escapeHtml(name) + ']</span>';
      return this.escapeHtml(name);
    },
    itemIconIsImage(icon) {
      if (!icon) return false;
      var s = String(icon);
      return s.indexOf('/') >= 0 || s.indexOf('http') === 0 || s.indexOf('data:') === 0;
    },
    boot() {
      this.loading = true;
      this.error = '';
      Promise.all([
        GameApi.stageTree(),
        GameApi.stageLevelMonsterList(this.levelId),
        GameApi.playerLayoutList()
      ])
        .then((results) => {
          var tree = results[0].data || [];
          this.stageTree = tree;
          this.levelTitle = this.resolveLevelTitle(tree, this.levelId) || this.levelId;
          this.monsters = this.applyMonsterDisplayNames(results[1].data || []);
          this.allies = results[2].data || [];
          this.assignAllyUids();
          this.initStandbyHp();
          this.$nextTick(() => { if (window.ArtSlots) ArtSlots.apply(this.$el); });
          if (!this.monsters.length) {
            this.error = '该关卡暂无怪物配置';
            return;
          }
          if (!this.allies.length) {
            this.error = '请先在「布局」上阵角色';
            return;
          }
          // 进场直接开战，不再展示「开始战斗」确认条
          this.startFight();
        })
        .catch((err) => {
          this.error = err.message || '战场加载失败';
          this.authCatch(err);
        })
        .finally(() => { this.loading = false; });
    },
    resolveLevelTitle(tree, levelId) {
      for (var i = 0; i < tree.length; i++) {
        var chapters = tree[i].chapters || [];
        for (var j = 0; j < chapters.length; j++) {
          var levels = chapters[j].levels || [];
          for (var k = 0; k < levels.length; k++) {
            var lv = levels[k];
            if (lv.id === levelId) return (lv.code || lv.name) + ' · ' + chapters[j].name;
          }
        }
      }
      return '';
    },
    flattenLevels(tree) {
      var list = [];
      (tree || []).forEach(function (t) {
        (t.chapters || []).forEach(function (ch) {
          (ch.levels || []).forEach(function (lv) { list.push(lv); });
        });
      });
      return list;
    },
    startFight() {
      if (this.fighting || this.replaying) return;
      if (!this.monsters.length || !this.allies.length) return;
      this.stopReplayClock();
      this.battleStarted = true;
      this.fighting = true;
      this.replaying = false;
      this.skipRequested = false;
      this.outcome = '';
      this.resultModal.show = false;
      this.resultBanner = '';
      this.logDrawerOpen = false;
      this.visibleLogs = [];
      this.pendingLogs = [];
      this.replayData = null;
      this.replayLogs = [];
      this.replayEvents = [];
      this.replayIndex = 0;
      this.eventIndex = 0;
      this.logCursor = 0;
      this.replayAvT = 0;
      this.logAvT = 0;
      this.axisDisplay = 0;
      this.axisLerp = null;
      this.axisWallOrigin = 0;
      this.axisAvOrigin = 0;
      this.axisFinalAv = 0;
      this.actingUid = '';
      this.hitUid = '';
      this.deadUids = {};
      this.chargeMap = {};
      this.unitSkillSlots = {};
      this.unitSkillById = {};
      this.buffMap = {};
      this.floaters = [];
      this.initStandbyHp();

      GameApi.battleFight(this.levelId)
        .then((res) => {
          var data = res.data || {};
          this.initFromSnaps(data.units);
          this.seedFocusChargesFromData(data);
          this.$nextTick(() => {
            if (window.ArtSlots) ArtSlots.apply(this.$el);
            this.playBattleReplay(data);
          });
        })
        .catch((err) => {
          this.fighting = false;
          this.battleStarted = false;
          this.skipRequested = false;
          this.authCatch(err);
        });
    }
  }
}).mount('#app');
</script>
</body>
</html>
