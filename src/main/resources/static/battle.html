<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>战斗</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/battle.css">
  <script src="/js/dev-live.js"></script>
  <script src="/js/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="page battle-page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="battle-header">
    <div>
      <h1>战斗</h1>
      <div class="stage-info" v-if="levelTitle">{{ levelTitle }}</div>
    </div>
    <button type="button" @click="goHome">首页</button>
  </div>

  <div v-if="loading" class="loading-wrap">战场部署中...</div>

  <div v-else-if="error" class="error-wrap">
    <div>{{ error }}</div>
    <button type="button" class="btn-battle-ghost" @click="goBack">返回出击</button>
  </div>

  <template v-else>
    <div class="battle-meta">
      <span class="meta-pill" :class="statusPillClass">{{ statusLabel }}</span>
      <span class="meta-pill">敌 {{ monsters.length }}</span>
      <span class="meta-pill">我 {{ allies.length }}</span>
    </div>

    <div class="battle-main">
      <div class="arena" :class="{ fighting: fighting, win: outcome === 'WIN', lose: outcome === 'LOSE' }">
        <div class="side-block">
          <div class="formation-board enemy">
            <div class="formation-grid">
              <div class="formation-cells" aria-hidden="true">
                <div v-for="n in 30" :key="'ec-' + n" class="formation-cell"></div>
              </div>
              <div class="formation-units">
                <div
                  v-for="(m, idx) in monsters"
                  :key="m.id || 'm-' + idx"
                  class="formation-unit"
                  :class="[
                    rarityClass(m.rarity),
                    unitAnimClass(m.monsterName, 'enemy'),
                    { dead: isDeadName(m.monsterName) }
                  ]"
                  :style="unitGridStyle(m)"
                >
                  <div class="unit-hp enemy" aria-hidden="true">
                    <div class="unit-hp-fill" :style="{ width: unitHpPct(m.monsterName) + '%' }"></div>
                  </div>
                  <span class="name name-enemy">{{ displayEnemyName(m.monsterName) }}</span>
                  <span class="sub">{{ rarityLabel(m.rarity) }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="vs-bar" :class="{ pulse: fighting && !outcome }">VS</div>

        <div class="side-block">
          <div class="formation-board ally">
            <div class="formation-grid">
              <div class="formation-cells" aria-hidden="true">
                <div v-for="n in 30" :key="'ac-' + n" class="formation-cell"></div>
              </div>
              <div class="formation-units">
                <div
                  v-for="(u, idx) in allies"
                  :key="u.roleId || 'a-' + idx"
                  class="formation-unit player"
                  :class="[
                    { main: u.mainRole },
                    unitAnimClass(u.roleName, 'ally'),
                    { dead: isDeadName(u.roleName) }
                  ]"
                  :style="unitGridStyle(u)"
                >
                  <div class="unit-hp ally" aria-hidden="true">
                    <div class="unit-hp-fill" :style="{ width: unitHpPct(u.roleName) + '%' }"></div>
                  </div>
                  <span class="name name-ally">{{ displayAllyName(u.roleName) }}</span>
                  <span class="sub">{{ u.gridH || 1 }}×{{ u.gridW || 1 }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div v-if="fighting && !outcome" class="fight-fx" aria-hidden="true">
          <span class="fx-ring"></span>
          <span class="fx-ring delay"></span>
        </div>
      </div>
    </div>

    <div v-if="!battleStarted" class="battle-footer">
      <div class="battle-tip">{{ battleTip }}</div>
      <button
        type="button"
        class="btn-battle-action"
        :disabled="!canFight"
        @click="startFight"
      >开始战斗</button>
      <button type="button" class="btn-battle-ghost" @click="goBack">重新选关</button>
    </div>

    <div v-if="showPlaybackBar" class="playback-bar" @click.stop>
      <button
        v-for="sp in [1, 2, 3]"
        :key="'sp-' + sp"
        type="button"
        class="playback-btn"
        :class="{ active: playbackSpeed === sp }"
        @click="setPlaybackSpeed(sp)"
      >{{ sp }}x</button>
      <button type="button" class="playback-btn skip" @click="skipReplay">跳过</button>
    </div>

    <div
      class="battle-log-panel"
      :class="{ expanded: battleStarted, clickable: visibleLogs.length }"
      ref="logPanel"
      @click="openLogModal"
    >
      <div class="battle-log-head">
        <span>战斗日志</span>
        <span class="battle-log-count">
          <template v-if="visibleLogs.length">{{ visibleLogs.length }}{{ pendingLogs.length ? ' / ' + (visibleLogs.length + pendingLogs.length) : '' }}</template>
          <template v-if="visibleLogs.length"> · 点击展开</template>
        </span>
      </div>
      <div class="battle-log-list" ref="logList">
        <div v-if="!visibleLogs.length" class="battle-log-empty">点击「开始战斗」后在此逐条播放</div>
        <template v-for="(block, bIdx) in visibleLogBlocks" :key="'logb-' + bIdx">
          <div v-if="block.kind === 'special'" class="battle-log-line" :class="block.cls" v-html="block.html"></div>
          <div v-else class="battle-log-group" :class="block.groupCls">
            <div
              v-for="(row, rIdx) in block.rows"
              :key="'logr-' + bIdx + '-' + rIdx"
              class="battle-log-line"
              :class="row.cls"
              v-html="row.html"
            ></div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <div v-if="logModal" class="result-mask" @click.self="closeLogModal">
    <div class="log-modal" @click.stop>
      <div class="log-modal-head">
        <div>
          <div class="log-modal-title">战斗日志</div>
          <div class="log-modal-sub" v-if="levelTitle">{{ levelTitle }}</div>
        </div>
        <button type="button" class="log-modal-close" @click="closeLogModal">关闭</button>
      </div>
      <div class="log-modal-list" ref="logModalList">
        <div v-if="!visibleLogs.length" class="battle-log-empty">暂无日志</div>
        <template v-for="(block, bIdx) in visibleLogBlocks" :key="'mlogb-' + bIdx">
          <div v-if="block.kind === 'special'" class="battle-log-line" :class="block.cls" v-html="block.html"></div>
          <div v-else class="battle-log-group" :class="block.groupCls">
            <div
              v-for="(row, rIdx) in block.rows"
              :key="'mlogr-' + bIdx + '-' + rIdx"
              class="battle-log-line"
              :class="row.cls"
              v-html="row.html"
            ></div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <div v-if="resultModal.show" class="result-mask" @click.self="closeResultModal">
    <div class="result-modal" :class="resultModal.outcome === 'WIN' ? 'is-win' : 'is-lose'">
      <div class="result-badge">{{ resultModal.outcome === 'WIN' ? '胜利' : '失败' }}</div>
      <h2 class="result-title">{{ resultModal.outcome === 'WIN' ? '战斗胜利' : '战斗失败' }}</h2>
      <div class="result-sub" v-if="levelTitle">{{ levelTitle }}</div>
      <div class="result-meta" v-if="resultModal.ticks != null">行动拍 {{ resultModal.ticks }}</div>

      <template v-if="resultModal.outcome === 'WIN'">
        <div class="result-section-label">获得材料</div>
        <div class="result-loot" v-if="resultModal.drops.length">
          <div v-for="(d, i) in resultModal.drops" :key="d.itemId || ('drop-' + i)" class="result-loot-row">
            <div class="result-loot-icon">
              <img v-if="itemIconIsImage(d.icon)" :src="d.icon" :alt="d.itemName">
              <span v-else>{{ d.icon || '📦' }}</span>
            </div>
            <div class="result-loot-name">{{ d.itemName || '未知材料' }}</div>
            <div class="result-loot-qty">×{{ d.quantity || 0 }}</div>
          </div>
        </div>
        <div v-else class="result-loot-empty">本场无掉落</div>
        <div class="result-loot-note">已放入仓库</div>
      </template>
      <div v-else class="result-lose-tip">再调整阵容或升级后再战</div>

      <div class="result-actions">
        <button
          v-if="resultModal.outcome === 'WIN'"
          type="button"
          class="result-btn primary"
          :disabled="!nextLevelId"
          @click="goNextLevel"
        >{{ nextLevelId ? '下一关' : '已是最后一关' }}</button>
        <button type="button" class="result-btn gold" @click="fightAgain">再战一次</button>
        <div class="result-actions-row">
          <button type="button" class="result-btn ghost" @click="goHome">回去首页</button>
          <button type="button" class="result-btn ghost" @click="viewLogs">查看日志</button>
        </div>
      </div>
    </div>
  </div>

  <div v-if="toast.show" class="toast" :class="toast.type">{{ toast.text }}</div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
const { createApp } = Vue;

function queryParam(name) {
  var params = new URLSearchParams(location.search);
  return params.get(name) || '';
}

createApp({
  data() {
    return {
      loading: true,
      error: '',
      levelId: '',
      levelTitle: '',
      stageTree: [],
      monsters: [],
      allies: [],
      battleStarted: false,
      fighting: false,
      replaying: false,
      outcome: '',
      visibleLogs: [],
      pendingLogs: [],
      actingName: '',
      hitName: '',
      deadNames: {},
      hpMap: {},
      replayTimer: null,
      replayData: null,
      replayLogs: [],
      replayIndex: 0,
      skipRequested: false,
      playbackSpeed: 1,
      resultModal: { show: false, outcome: '', ticks: null, drops: [] },
      logModal: false,
      toast: { show: false, text: '', type: 'error' }
    };
  },
  computed: {
    showPlaybackBar() {
      return this.battleStarted && (this.fighting || this.replaying) && !this.resultModal.show;
    },
    canFight() {
      return this.monsters.length > 0 && this.allies.length > 0 && !this.fighting && !this.replaying;
    },
    statusLabel() {
      if (this.outcome === 'WIN') return '胜利';
      if (this.outcome === 'LOSE') return '失败';
      if (this.fighting || this.replaying) return '战斗中';
      return '待命';
    },
    statusPillClass() {
      if (this.outcome === 'WIN') return 'win';
      if (this.outcome === 'LOSE') return 'lose';
      if (this.fighting || this.replaying) return 'fighting';
      return 'ready';
    },
    battleTip() {
      if (!this.monsters.length) return '该关卡暂无怪物配置';
      if (!this.allies.length) return '请先在「布局」上阵角色';
      return '双方已就位，可开始行动值战斗';
    },
    nextLevelId() {
      var list = this.flattenLevels(this.stageTree);
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === this.levelId) {
          return list[i + 1] ? list[i + 1].id : '';
        }
      }
      return '';
    },
    allyNameSet() {
      var set = {};
      (this.allies || []).forEach((a) => {
        var n = a && (a.roleName || a.name);
        if (n) set[n] = true;
      });
      // 开战快照里的己方名也纳入，保证日志着色
      Object.keys(this.hpMap || {}).forEach((k) => {
        var s = this.hpMap[k];
        if (s && (s.side === 'ALLY' || s.side === 'ally')) set[k] = true;
      });
      return set;
    },
    enemyNameSet() {
      var set = {};
      (this.monsters || []).forEach((m) => {
        var n = m && (m.monsterName || m.name);
        if (n) set[n] = true;
      });
      Object.keys(this.hpMap || {}).forEach((k) => {
        var s = this.hpMap[k];
        if (s && (s.side === 'ENEMY' || s.side === 'enemy')) set[k] = true;
      });
      return set;
    },
    /** 一组行动包成一块；尾部胜负+掉落用固定色整块括起 */
    visibleLogBlocks() {
      var blocks = [];
      var group = -1;
      var current = null;
      var lines = this.visibleLogs || [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i] || '';
        var child = line.indexOf('└') >= 0 || /^\s+/.test(line);
        var isBoot = line.indexOf('装备充能技能') >= 0;
        var isResultHead = line.indexOf('战斗胜利') >= 0 || line.indexOf('战斗失败') >= 0
          || line.indexOf('总计掉落') >= 0;
        if (isBoot) {
          current = null;
          blocks.push({
            kind: 'special',
            cls: this.logLineClass(line),
            html: this.escapeHtml(line)
          });
          continue;
        }
        if (isResultHead) {
          current = {
            kind: 'group',
            groupCls: 'log-group-result',
            rows: []
          };
          blocks.push(current);
          current.rows.push({
            cls: [this.logLineClass(line), 'is-head'].join(' '),
            html: this.escapeHtml(line)
          });
          continue;
        }
        if (!child) {
          group += 1;
          var g = group % 4;
          current = {
            kind: 'group',
            groupCls: 'log-group-' + g,
            rows: []
          };
          blocks.push(current);
          current.rows.push({
            cls: [this.logLineClass(line), 'is-head'].join(' '),
            html: this.formatLogHtml(line)
          });
        } else {
          if (!current) {
            group += 1;
            current = {
              kind: 'group',
              groupCls: 'log-group-' + (group % 4),
              rows: []
            };
            blocks.push(current);
          }
          current.rows.push({
            cls: [this.logLineClass(line), 'is-child'].join(' '),
            html: this.formatLogHtml(line)
          });
        }
      }
      return blocks;
    }
  },
  mounted() {
    if (!GameApi.getToken()) {
      location.href = APP_CONFIG.loginPage || '/login.html';
      return;
    }
    var savedSpeed = Number(localStorage.getItem('battlePlaybackSpeed') || 1);
    if (savedSpeed === 1 || savedSpeed === 2 || savedSpeed === 3) {
      this.playbackSpeed = savedSpeed;
    }
    this.levelId = queryParam('levelId')
      || localStorage.getItem(APP_CONFIG.selectedLevelKey || 'selectedLevelId')
      || '';
    if (!this.levelId) {
      this.loading = false;
      this.error = '未选择关卡';
      return;
    }
    this.boot();
  },
  beforeUnmount() {
    if (this.replayTimer) clearTimeout(this.replayTimer);
  },
  methods: {
    showToast(text, type) {
      this.toast = { show: true, text: text || '', type: type || 'error' };
      setTimeout(() => { this.toast.show = false; }, 2400);
    },
    authCatch(err) {
      this.showToast(err.message || '加载失败');
      if (err.result && (err.result.code === '403' || String(err.message).indexOf('登录') >= 0)) {
        GameApi.clearToken();
        setTimeout(() => { location.href = APP_CONFIG.loginPage || '/login.html'; }, 800);
      }
    },
    shortName(name) {
      if (!name) return '?';
      // 同名编号后可能更长，如 狼骑兵2
      return name.length > 5 ? name.slice(0, 5) : name;
    },
    displayAllyName(name) {
      if (!name) return '[?]';
      var shown = this.shortName(name);
      return '[' + shown + ']';
    },
    displayEnemyName(name) {
      if (!name) return '[?]';
      var shown = this.shortName(name);
      return '[' + shown + ']';
    },
    /** 场内同名怪物加序号：史莱姆1、史莱姆2（与后端战斗命名一致） */
    applyMonsterDisplayNames(list) {
      var arr = list || [];
      var counts = {};
      arr.forEach((m) => {
        var base = (m && (m.monsterName || m.name)) || '怪物';
        counts[base] = (counts[base] || 0) + 1;
      });
      var seq = {};
      arr.forEach((m) => {
        if (!m) return;
        var base = m.monsterName || m.name || '怪物';
        if (counts[base] > 1) {
          seq[base] = (seq[base] || 0) + 1;
          m.monsterName = base + seq[base];
        } else {
          m.monsterName = base;
        }
      });
      return arr;
    },
    rarityLabel(r) {
      return { NORMAL: '普通', RARE: '稀有', EPIC: '史诗', BOSS: 'BOSS', SPECIAL: '特殊' }[r] || r || '';
    },
    rarityClass(r) {
      return {
        NORMAL: 'rarity-normal',
        RARE: 'rarity-rare',
        EPIC: 'rarity-epic',
        BOSS: 'rarity-boss',
        SPECIAL: 'rarity-special'
      }[r] || 'rarity-normal';
    },
    unitGridStyle(item) {
      var col = (item.posCol || 0) + 1;
      var row = (item.posRow || 0) + 1;
      var w = item.gridW || 1;
      var h = item.gridH || 1;
      return {
        gridColumn: col + ' / span ' + w,
        gridRow: row + ' / span ' + h
      };
    },
    unitAnimClass(name, side) {
      // 必须精确匹配，避免「史莱姆」带动「史莱姆1/2」
      return {
        acting: !!(this.actingName && name && name === this.actingName),
        hit: !!(this.hitName && name && name === this.hitName),
        ['side-' + side]: true
      };
    },
    isDeadName(name) {
      if (!name) return false;
      return !!this.deadNames[name];
    },
    unitHpPct(name) {
      var s = this.findHpState(name);
      if (!s || !s.maxHp) return 100;
      return Math.max(0, Math.min(100, (s.hp / s.maxHp) * 100));
    },
    resolveHpKey(name) {
      if (!name || !this.hpMap) return '';
      if (this.hpMap[name]) return name;
      return '';
    },
    findHpState(name) {
      var key = this.resolveHpKey(name);
      return key ? this.hpMap[key] : null;
    },
    initStandbyHp() {
      var map = {};
      (this.monsters || []).forEach((m) => {
        if (!m || !m.monsterName) return;
        var max = Math.max(1, m.baseHp || 1);
        map[m.monsterName] = { hp: max, maxHp: max, side: 'ENEMY' };
      });
      (this.allies || []).forEach((u) => {
        if (!u || !u.roleName) return;
        var max = Math.max(1, (u.baseHp || 0) + (u.extraHp || 0) || 1);
        map[u.roleName] = { hp: max, maxHp: max, side: 'ALLY' };
      });
      this.hpMap = map;
    },
    initHpFromSnaps(units) {
      var map = {};
      (units || []).forEach((u) => {
        if (!u || !u.name) return;
        var max = Math.max(1, u.maxHp || 1);
        var hp = u.hp == null ? max : Math.max(0, u.hp);
        map[u.name] = { hp: hp, maxHp: max, side: u.side || '' };
      });
      if (Object.keys(map).length) {
        this.hpMap = map;
        // 用战斗快照名同步场上怪物显示名（含 史莱姆1/2）
        var enemyNames = (units || []).filter((u) => u && (u.side === 'ENEMY' || u.side === 'enemy')).map((u) => u.name);
        if (enemyNames.length && this.monsters && this.monsters.length === enemyNames.length) {
          this.monsters.forEach((m, idx) => {
            if (m && enemyNames[idx]) m.monsterName = enemyNames[idx];
          });
        }
      } else {
        this.initStandbyHp();
      }
    },
    applyHpFromLog(line) {
      if (!line) return;
      var dmg = line.match(/对\s*(.+?)\s*造成\s*(\d+)/);
      if (dmg) {
        this.changeHp(dmg[1].trim(), -Number(dmg[2]));
        if (line.indexOf('击杀') >= 0) {
          this.setHpZero(dmg[1].trim());
        }
        return;
      }
      var heal = line.match(/治疗\s*(.+?)\s*(\d+)/);
      if (heal) {
        this.changeHp(heal[1].trim(), Number(heal[2]));
      }
    },
    changeHp(name, delta) {
      var key = this.resolveHpKey(name);
      if (!key) return;
      var s = this.hpMap[key];
      var next = Object.assign({}, this.hpMap);
      next[key] = {
        hp: Math.max(0, Math.min(s.maxHp, s.hp + delta)),
        maxHp: s.maxHp,
        side: s.side
      };
      this.hpMap = next;
    },
    setHpZero(name) {
      var key = this.resolveHpKey(name);
      if (!key) return;
      var s = this.hpMap[key];
      var next = Object.assign({}, this.hpMap);
      next[key] = { hp: 0, maxHp: s.maxHp, side: s.side };
      this.hpMap = next;
    },
    logLineClass(line) {
      if (!line) return '';
      if (line.indexOf('胜利') >= 0) return 'is-win';
      if (line.indexOf('失败') >= 0) return 'is-lose';
      if (line.indexOf('装备充能技能') >= 0) return 'is-equip';
      if (line.indexOf('释放') >= 0) return 'is-cast';
      if (line.indexOf('击杀') >= 0) return 'is-kill';
      if (line.indexOf('造成') >= 0) return 'is-dmg';
      if (line.indexOf('充能 +') >= 0) return 'is-charge';
      if (line.indexOf('治疗') >= 0) return 'is-heal';
      if (line.indexOf('└') >= 0 && line.indexOf(' * ') >= 0) return 'is-loot';
      if (line.indexOf('无掉落') >= 0) return 'is-loot';
      return '';
    },
    escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    },
    formatLogHtml(line) {
      var raw = String(line == null ? '' : line);
      var prefix = '';
      var body = raw;
      // 新格式：首行「行动值 N」换行 + 正文；兼容旧「[行动值 N] 正文」
      var avMulti = raw.match(/^行动值\s*(\d+)\n([\s\S]*)$/);
      var avLegacy = raw.match(/^\[行动值\s*(\d+)\]\s*(.*)$/);
      if (avMulti) {
        prefix = '<div class="log-action-val">行动值 ' + this.escapeHtml(avMulti[1]) + '</div>';
        body = avMulti[2] || '';
      } else if (avLegacy) {
        prefix = '<div class="log-action-val">行动值 ' + this.escapeHtml(avLegacy[1]) + '</div>';
        body = avLegacy[2] || '';
      }
      // 对 {目标} 造成 {N} 伤害 → 伤害数字按阵营上色；己方目标显示为 [名]
      var m = body.match(/^(.*对\s*)(.+?)(\s*造成\s*)(\d+)(\s*伤害.*)$/);
      if (m) {
        var target = m[2];
        var colorCls = 'dmg-num';
        if (this.allyNameSet[target]) colorCls = 'dmg-num-ally';
        else if (this.enemyNameSet[target]) colorCls = 'dmg-num-enemy';
        return prefix
          + '<div class="log-action-body">'
          + this.wrapNamesInSegment(m[1])
          + this.formatLogNameHtml(target)
          + this.escapeHtml(m[3])
          + '<span class="' + colorCls + '">' + this.escapeHtml(m[4]) + '</span>'
          + this.wrapNamesInSegment(m[5])
          + '</div>';
      }
      // 释放行等：己方 [角色名] 着色；怪物名加粗
      if (prefix) {
        return prefix + '<div class="log-action-body">' + this.wrapNamesInSegment(body) + '</div>';
      }
      return this.wrapNamesInSegment(body);
    },
    stripLogActionPrefix(line) {
      var s = String(line == null ? '' : line);
      s = s.replace(/^行动值\s*\d+\n/, '');
      s = s.replace(/^\[行动值\s*\d+\]\s*/, '');
      return s;
    },
    wrapNamesInSegment(segment) {
      var raw = String(segment == null ? '' : segment);
      var html = this.escapeHtml(raw);
      html = this.wrapAllyNamesInHtml(html, raw);
      html = this.wrapEnemyNamesInHtml(html, raw);
      return html;
    },
    formatLogNameHtml(name) {
      if (!name) return '';
      if (this.allyNameSet[name]) {
        return '<span class="log-name-ally">[' + this.escapeHtml(name) + ']</span>';
      }
      if (this.enemyNameSet[name]) {
        return '<span class="log-name-enemy">[' + this.escapeHtml(name) + ']</span>';
      }
      return this.escapeHtml(name);
    },
    wrapAllyNamesInHtml(html, raw) {
      var out = html;
      Object.keys(this.allyNameSet || {}).forEach((name) => {
        if (!name || raw.indexOf(name) < 0) return;
        var re = new RegExp(this.escapeRegExp(this.escapeHtml(name)), 'g');
        out = out.replace(re, '<span class="log-name-ally">[' + this.escapeHtml(name) + ']</span>');
      });
      return out;
    },
    wrapEnemyNamesInHtml(html, raw) {
      // 先长后短，避免 史莱姆 吃掉 史莱姆1；跳过已包裹片段
      var names = Object.keys(this.enemyNameSet || {}).sort(function (a, b) { return b.length - a.length; });
      var out = html;
      names.forEach((name) => {
        if (!name || raw.indexOf(name) < 0) return;
        var token = this.escapeHtml(name);
        var re = new RegExp('(?!<[^>]*)' + this.escapeRegExp(token) + '(?![^<]*>)', 'g');
        out = out.replace(re, function (match, offset, full) {
          // 已在 log-name-* 内则不重复包
          var before = full.slice(0, offset);
          if (/<span class="log-name-(?:ally|enemy)">[^<]*$/.test(before)) return match;
          return '<span class="log-name-enemy">[' + match + ']</span>';
        });
      });
      return out;
    },
    escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    },
    boot() {
      this.loading = true;
      this.error = '';
      Promise.all([
        GameApi.stageTree(),
        GameApi.stageLevelMonsterList(this.levelId),
        GameApi.playerLayoutList()
      ])
        .then((results) => {
          var tree = results[0].data || [];
          this.stageTree = tree;
          this.levelTitle = this.resolveLevelTitle(tree, this.levelId) || this.levelId;
          this.monsters = this.applyMonsterDisplayNames(results[1].data || []);
          this.allies = results[2].data || [];
          this.initStandbyHp();
        })
        .catch((err) => {
          this.error = err.message || '战场加载失败';
          this.authCatch(err);
        })
        .finally(() => { this.loading = false; });
    },
    resolveLevelTitle(tree, levelId) {
      for (var i = 0; i < tree.length; i++) {
        var chapters = tree[i].chapters || [];
        for (var j = 0; j < chapters.length; j++) {
          var levels = chapters[j].levels || [];
          for (var k = 0; k < levels.length; k++) {
            var lv = levels[k];
            if (lv.id === levelId) {
              return (lv.code || lv.name) + ' · ' + chapters[j].name;
            }
          }
        }
      }
      return '';
    },
    flattenLevels(tree) {
      var list = [];
      (tree || []).forEach(function (t) {
        (t.chapters || []).forEach(function (ch) {
          (ch.levels || []).forEach(function (lv) {
            list.push(lv);
          });
        });
      });
      return list;
    },
    itemIconIsImage(icon) {
      if (!icon) return false;
      var s = String(icon);
      return s.indexOf('/') >= 0 || s.indexOf('http') === 0 || s.indexOf('data:') === 0;
    },
    startFight() {
      if (this.fighting || this.replaying) return;
      if (!this.monsters.length || !this.allies.length) return;
      if (this.replayTimer) {
        clearTimeout(this.replayTimer);
        this.replayTimer = null;
      }
      this.battleStarted = true;
      this.fighting = true;
      this.replaying = false;
      this.skipRequested = false;
      this.outcome = '';
      this.resultModal.show = false;
      this.logModal = false;
      this.visibleLogs = [];
      this.pendingLogs = [];
      this.replayData = null;
      this.replayLogs = [];
      this.replayIndex = 0;
      this.actingName = '';
      this.hitName = '';
      this.deadNames = {};
      this.initStandbyHp();

      GameApi.battleFight(this.levelId)
        .then((res) => {
          var data = res.data || {};
          this.initHpFromSnaps(data.units);
          this.playBattleReplay(data);
        })
        .catch((err) => {
          this.fighting = false;
          this.battleStarted = false;
          this.skipRequested = false;
          this.authCatch(err);
        });
    },
    setPlaybackSpeed(sp) {
      this.playbackSpeed = sp;
      localStorage.setItem('battlePlaybackSpeed', String(sp));
      if (this.replaying) this.scheduleReplayStep();
    },
    replayStepDelay() {
      var total = this.replayLogs.length;
      // 1x 基础间隔已按原先减半（延迟翻倍）
      var base = total > 100 ? 110 : (total > 40 ? 220 : 520);
      return Math.max(30, Math.round(base / this.playbackSpeed));
    },
    animDuration(ms) {
      return Math.max(120, Math.round((ms * 2) / this.playbackSpeed));
    },
    playBattleReplay(data) {
      this.replayData = data;
      this.replayLogs = (data.logs || []).slice();
      this.replayIndex = 0;
      this.pendingLogs = this.replayLogs.slice();
      this.fighting = false;
      this.replaying = true;
      if (this.skipRequested) {
        this.skipReplay();
        return;
      }
      this.scheduleReplayStep();
    },
    scheduleReplayStep() {
      if (this.replayTimer) clearTimeout(this.replayTimer);
      var self = this;
      this.replayTimer = setTimeout(function () {
        self.advanceReplay();
      }, this.replayStepDelay());
    },
    advanceReplay() {
      if (!this.replaying) return;
      if (this.replayIndex >= this.replayLogs.length) {
        this.pendingLogs = [];
        this.finishReplay(this.replayData || {});
        return;
      }
      var line = this.replayLogs[this.replayIndex++];
      this.pendingLogs = this.replayLogs.slice(this.replayIndex);
      this.visibleLogs.push(line);
      this.applyLogAnim(line);
      this.$nextTick(() => {
        var el = this.$refs.logList;
        if (el) el.scrollTop = el.scrollHeight;
      });
      this.scheduleReplayStep();
    },
    skipReplay() {
      if (!this.fighting && !this.replaying) return;
      if (this.fighting && !this.replaying) {
        this.skipRequested = true;
        return;
      }
      if (this.replayTimer) {
        clearTimeout(this.replayTimer);
        this.replayTimer = null;
      }
      var rest = this.replayLogs.slice(this.replayIndex);
      if (rest.length) {
        this.visibleLogs = this.visibleLogs.concat(rest);
        var dead = {};
        Object.keys(this.deadNames).forEach((k) => { dead[k] = true; });
        rest.forEach((line) => {
          this.applyHpFromLog(line);
          var dmg = line && line.match(/对\s*(.+?)\s*造成/);
          if (dmg && line.indexOf('击杀') >= 0) {
            dead[dmg[1].trim()] = true;
          }
        });
        this.deadNames = dead;
      }
      this.replayIndex = this.replayLogs.length;
      this.pendingLogs = [];
      this.actingName = '';
      this.hitName = '';
      this.finishReplay(this.replayData || {});
    },
    applyLogAnim(line) {
      if (!line) return;
      this.applyHpFromLog(line);
      var body = this.stripLogActionPrefix(line);
      var cast = body.match(/^(.+?)\s*释放/);
      if (cast) {
        this.actingName = cast[1].trim();
        this.hitName = '';
        var self = this;
        var name = cast[1].trim();
        setTimeout(function () { if (self.actingName === name) self.actingName = ''; }, this.animDuration(420));
        return;
      }
      var dmg = body.match(/对\s*(.+?)\s*造成/);
      if (dmg) {
        this.hitName = dmg[1].trim();
        if (body.indexOf('击杀') >= 0) {
          var dead = {};
          Object.keys(this.deadNames).forEach((k) => { dead[k] = true; });
          dead[this.hitName] = true;
          this.deadNames = dead;
        }
        var self2 = this;
        var hit = dmg[1].trim();
        setTimeout(function () { if (self2.hitName === hit) self2.hitName = ''; }, this.animDuration(380));
      }
    },
    finishReplay(data) {
      if (this.replayTimer) {
        clearTimeout(this.replayTimer);
        this.replayTimer = null;
      }
      this.replaying = false;
      this.fighting = false;
      this.skipRequested = false;
      this.actingName = '';
      this.hitName = '';
      this.outcome = (data && data.outcome) || '';
      this.resultModal = {
        show: true,
        outcome: this.outcome,
        ticks: data && data.ticks != null ? data.ticks : null,
        drops: (data && data.drops) || []
      };
    },
    closeResultModal() {
      this.resultModal.show = false;
    },
    openLogModal() {
      if (!this.visibleLogs.length) return;
      this.logModal = true;
      this.$nextTick(() => {
        var el = this.$refs.logModalList;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },
    closeLogModal() {
      this.logModal = false;
    },
    viewLogs() {
      this.resultModal.show = false;
      this.openLogModal();
    },
    fightAgain() {
      this.resultModal.show = false;
      this.logModal = false;
      this.startFight();
    },
    goNextLevel() {
      if (!this.nextLevelId) {
        this.showToast('已是最后一关');
        return;
      }
      localStorage.setItem(APP_CONFIG.selectedLevelKey || 'selectedLevelId', this.nextLevelId);
      location.href = (APP_CONFIG.battlePage || '/battle.html')
        + '?levelId=' + encodeURIComponent(this.nextLevelId);
    },
    goHome() {
      location.href = APP_CONFIG.homePage || '/index.html';
    },
    goBack() {
      location.href = (APP_CONFIG.homePage || '/index.html') + '#deploy';
    }
  }
}).mount('#app');
</script>
</body>
</html>
